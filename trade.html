* { box-sizing: border-box; }

.tip .row { display: flex; align-items: center; gap: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; }
.empty { color: var(--text-muted); padding: 8px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.ops { display: grid; grid-template-columns: 300px 1fr; gap: 12px; }

.oplist { max-height: 470px; overflow-y: auto; border: 1px solid var(--grid); border-radius: 8px; }
.op { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--grid);

.op:hover { background: var(--surface-0); }

.kind { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }

.ophead b { font-weight: 600; }
.rule { font-size: 12px; color: var(--text-secondary); margin: 2px 0 8px; }
.keys { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.keys i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }

tr.clk { cursor: pointer; } tr.clk:hover td { background: var(--surface-0); }
.why { white-space: normal; min-width: 220px; color: var(--text-secondary); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

(function chart() {
  const svg = document.getElementById("svg"), tip = document.getElementById("tip");
  const ranges = document.getElementById("ranges"), legend = document.getElementById("legend");
  const W = 1000, H = 320, m = {l: 56, r: 16, t: 12, b: 28}, DAY = 864e5;
  const ALL = D.times.map(t => new Date(t).getTime());
  const RANGES = [
    ["all", "Depuis le début", () => -Infinity],
    ["month", "1 mois", () => Date.now() - 30 * DAY],
    ["week", "1 semaine", () => Date.now() - 7 * DAY],
    ["day", "Aujourd'hui", () => new Date().setHours(0, 0, 0, 0)],
  ];
  ranges.innerHTML = RANGES.map(([k, l]) => `<button class="tab" role="tab" data-k="${k}">${l}</button>`).join("");

  function draw(k) {
    ranges.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
    try { localStorage.setItem("liquid-range", k); } catch (e) {}
    const cut = RANGES.find(r => r[0] === k)[2]();
    // on garde le dernier point avant la coupure : la courbe part du capital au début de la période
    let i0 = ALL.findIndex(t => t >= cut);
    if (i0 < 0) i0 = Math.max(ALL.length - 1, 0); else if (i0 > 0 && ALL[i0] > cut) i0--;
    const times = ALL.slice(i0), eq = Object.fromEntries(D.books.map(b => [b.key, D.equity[b.key].slice(i0)]));

    legend.innerHTML = D.books.map(b => {
      const v = eq[b.key], d = v.length > 1 ? v.at(-1) - v[0] : 0;
      return `<span><span class="sw" style="background:${color(b.key)}"></span>${esc(b.label)}` +
        (v.length > 1 ? ` <span class="${cls(d)}">${d >= 0 ? "+" : ""}${fmt(d)} $</span>` : "") + `</span>`;
    }).join("");
    tip.style.display = "none";
    if (times.length < 2) { svg.innerHTML = `<text x="20" y="40" fill="${css("--text-muted")}" font-size="14">${ALL.length < 2 ? "Les courbes apparaîtront après quelques bougies." : k === "day" ? "Pas encore de bougie aujourd'hui." : "Pas assez de points sur cette période."}</text>`; return; }

    const all = D.books.flatMap(b => eq[b.key]).concat([D.capital]);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = Math.max((hi - lo) * 0.1, 5); lo -= pad; hi += pad;
    const x = t => m.l + (t - times[0]) / (times.at(-1) - times[0]) * (W - m.l - m.r);
    const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
    const span = times.at(-1) - times[0];
    const tick = d => span <= DAY && new Date(times[0]).toDateString() === new Date(times.at(-1)).toDateString()
      ? d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"})
      : span > 3 * DAY ? d.toLocaleDateString("fr-FR", {day: "2-digit", month: "2-digit"})
      : d.toLocaleString("fr-FR", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = lo + (hi - lo) * i / 4;
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--grid")}"/>`;
      g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${css("--text-muted")}">${fmt(v, 0)}</text>`;
    }
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(D.capital)}" y2="${y(D.capital)}" stroke="${css("--text-muted")}" stroke-dasharray="4 4"/>`;
    const nt = Math.min(6, times.length);
    for (let i = 0; i < nt; i++) {
      const t = times[0] + span * i / (nt - 1);
      g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === nt - 1 ? "end" : "middle"}" font-size="11" fill="${css("--text-muted")}">${tick(new Date(t))}</text>`;
    }
    for (const b of D.books) {
      const pts = eq[b.key].map((v, i) => `${x(times[i])},${y(v)}`).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="${color(b.key)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    g += `<line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="${css("--text-muted")}" visibility="hidden"/><g id="dots"></g>`;
    g += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="hit"/>`;
    svg.innerHTML = g;
    const hit = svg.querySelector("#hit"), cross = svg.querySelector("#cross"), dots = svg.querySelector("#dots");
    hit.addEventListener("mousemove", e => {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
      let i = 0, best = Infinity;
      times.forEach((t, k) => { const d = Math.abs(x(t) - sx); if (d < best) { best = d; i = k; } });
      cross.setAttribute("x1", x(times[i])); cross.setAttribute("x2", x(times[i])); cross.setAttribute("visibility", "visible");
      dots.innerHTML = D.books.map(b => `<circle cx="${x(times[i])}" cy="${y(eq[b.key][i])}" r="4" fill="${color(b.key)}" stroke="${css("--surface-1")}" stroke-width="2"/>`).join("");
      const rows = [...D.books].sort((a, c) => eq[c.key][i] - eq[a.key][i]);
      tip.innerHTML = `<div class="muted">${new Date(times[i]).toLocaleString("fr-FR", {weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"})}</div>` +
        rows.map(b => `<div class="row"><span class="sw" style="background:${color(b.key)}"></span>${esc(b.label)}&nbsp;<b>${fmt(eq[b.key][i])} $</b></div>`).join("");
      tip.style.display = "block";
      const cx = (x(times[i]) / W) * r.width;
      tip.style.left = Math.min(cx + 14, r.width - tip.offsetWidth - 4) + "px";
      tip.style.top = "10px";
    });
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.innerHTML = ""; });
  }

  if (!D.ops.length) { list.innerHTML = `<div class="empty" style="padding:10px">Aucune opération pour l'instant.</div>`; return; }
  const GROUPS = ["En cours", "À venir", "Clôturés gagnants", "Clôturés perdants"];
  const grp = o => o.kind === "position" ? 0 : o.kind === "pending" ? 1 : o.pnl > 0 ? 2 : 3;
  D.ops.sort((a, b) => grp(a) - grp(b));   // tri stable : l'ordre chronologique est gardé dans chaque groupe
  list.innerHTML = D.ops.map((o, i) => `${i === 0 || grp(D.ops[i - 1]) !== grp(o) ? `<div class="grp">${GROUPS[grp(o)]}</div>` : ""}<button class="op" role="option" data-i="${i}">
    <div class="kind">${KIND[o.kind]}</div>
    <div><span class="sw" style="display:inline-block;background:${color(o.book)}"></span> <b>${short(o.coin)}</b> ${o.kind === "pending" && o.action === "close" ? "fermer" : (o.side > 0 ? "long" : "short")} · ${esc(label(o.book))}</div>
    <div class="l2">${o.pnl != null ? `<span class="${cls(o.pnl)}">${fmt(o.pnl)} $ (${fmt(o.r)} R)</span> · ` : ""}${o.t_open ? hm(o.t_open) : "prochaine bougie"}${o.t_close ? " → " + hm(o.t_close) : ""}</div>
  </button>`).join("");

  function draw(i) {
    const o = D.ops[i];
    list.querySelectorAll(".op").forEach(b => b.setAttribute("aria-selected", b.dataset.i == i));
    head.innerHTML = [
      `<span><b>${short(o.coin)}</b> ${o.side > 0 ? "long" : o.side < 0 ? "short" : ""}</span>`,
      o.entry != null ? `<span>Entrée <b>${px(o.entry)}</b></span>` : "",
      o.stop != null ? `<span>Stop <b>${px(o.stop)}</b></span>` : "",
      o.target != null ? `<span>Objectif <b>${px(o.target)}</b></span>` : (o.kind !== "pending" || o.action === "open" ? `<span class="muted">Pas d'objectif fixe : sortie sur signal, stop ou durée max</span>` : ""),
      o.exit != null ? `<span>Sortie <b>${px(o.exit)}</b></span>` : "",
      o.pnl != null ? `<span>PnL <b class="${cls(o.pnl)}">${fmt(o.pnl)} $ (${fmt(o.r)} R)</b></span>` : "",
    ].join("");
    const key = (c, st, t) => `<span><i style="border-color:var(${c});border-top-style:${st}"></i>${t}</span>`;
    document.getElementById("keys").innerHTML = [
      o.entry != null ? key("--entry", "solid", "Entrée") : "",
      o.stop != null ? key("--critical", "dashed", "Stop") : "",
      o.target != null ? key("--good", "dashed", "Objectif") : "",
      o.exit != null ? key("--text-secondary", "dotted", "Sortie") : "",
      `<span>${o.t_open ? "▲ ▼ entrée · " : ""}${o.t_close ? "✕ sortie · " : ""}${o.t_open ? "zone grisée = durée de l'opération · " : ""}bougies 15 min, heure de Paris</span>`,
    ].join("");
    rule.textContent = [o.rule ? "Règle : " + o.rule : "", o.why && o.why !== "signal" ? "Pourquoi : " + o.why : ""]
      .filter(Boolean).join(" — ");

    const C = o.candles, W = 900, H = 380, m = {l: 60, r: 14, t: 10, b: 26}, vh = 50;
    if (!C.length) { svg.innerHTML = `<text x="20" y="40" fill="${css("--text-muted")}">Pas de bougies disponibles.</text>`; return; }
    const levels = [o.entry, o.exit, o.stop, o.target].filter(v => v != null);
    let lo = Math.min(...C.map(c => c[3]), ...levels), hi = Math.max(...C.map(c => c[2]), ...levels);
    const pad = (hi - lo) * 0.06 || hi * 0.002; lo -= pad; hi += pad;
    const pw = (W - m.l - m.r) / C.length, bw = Math.max(2, Math.min(10, pw * 0.65));
    const x = k => m.l + pw * (k + 0.5), y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b - vh - 8);
    const vmax = Math.max(...C.map(c => c[5])) || 1, vy0 = H - m.b;
    const idx = t => { let b = 0, d = Infinity; C.forEach((c, k) => { const e = Math.abs(c[0] - t); if (e < d) { d = e; b = k; } }); return b; };
    let g = "";
    for (let k = 0; k <= 4; k++) {
      const v = lo + (hi - lo) * k / 4;
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--grid")}"/>` +
           `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${css("--text-muted")}">${px(v)}</text>`;
    }
    const step = Math.ceil(C.length / 7);
    C.forEach((c, k) => { if (k % step === 0) g += `<text x="${x(k)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${css("--text-muted")}">${hm(c[0])}</text>`; });
    if (o.t_open) {   // zone de l'opération
      const a = idx(o.t_open), b = o.t_close ? idx(o.t_close) : C.length - 1;
      g += `<rect x="${x(a) - pw / 2}" y="${m.t}" width="${(b - a + 1) * pw}" height="${vy0 - m.t}" fill="${css("--text-muted")}" opacity="0.10"/>`;
    }
    C.forEach((c, k) => {
      const col = css(c[4] >= c[1] ? "--up" : "--down"), live = c[6] === 1;
      if (live) g += `<g opacity="0.45">`;
      g += `<line x1="${x(k)}" x2="${x(k)}" y1="${y(c[2])}" y2="${y(c[3])}" stroke="${col}" stroke-width="1"/>`;
      g += `<rect x="${x(k) - bw / 2}" y="${y(Math.max(c[1], c[4]))}" width="${bw}" height="${Math.max(1, Math.abs(y(c[1]) - y(c[4])))}" fill="${col}" rx="1"/>`;
      const vhgt = c[5] / vmax * vh;
      g += `<rect x="${x(k) - bw / 2}" y="${vy0 - vhgt}" width="${bw}" height="${vhgt}" fill="${css("--text-muted")}" opacity="0.35"/>`;
      if (live) g += `</g><text x="${x(k)}" y="${y(c[2]) - 6}" text-anchor="middle" font-size="10" fill="${css("--text-muted")}">en cours</text>`;
    });
    const hline = (v, colv, dash, txt) => v == null ? "" :
      `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css(colv)}" stroke-width="1.5" ${dash ? `stroke-dasharray="${dash}"` : ""}/>` +
      `<text x="${m.l + 6}" y="${y(v) - 4}" text-anchor="start" font-size="11" fill="${css("--text-secondary")}">${txt} ${px(v)}</text>`;
    g += hline(o.stop, "--critical", "5 4", "stop") + hline(o.target, "--good", "5 4", "objectif") + hline(o.entry, "--entry", "", "entrée");
    if (o.exit != null) g += hline(o.exit, "--text-secondary", "2 3", "sortie");
    if (o.t_open && o.entry != null) {   // triangle d'entrée (vers le haut = long)
      const k = idx(o.t_open), yy = y(o.entry), s = o.side > 0 ? 1 : -1;
      g += `<path d="M${x(k)} ${yy + s * 4} l-6 ${s * 10} h12 z" fill="${css("--entry")}" stroke="${css("--surface-1")}" stroke-width="2"/>`;
    }
    if (o.t_close && o.exit != null) {
      const k = idx(o.t_close), yy = y(o.exit);
      g += `<path d="M${x(k) - 5} ${yy - 5} l10 10 M${x(k) + 5} ${yy - 5} l-10 10" stroke="${css("--text-primary")}" stroke-width="2.5"/>`;
    }
    g += `<line id="ccross" y1="${m.t}" y2="${vy0}" stroke="${css("--text-muted")}" visibility="hidden"/>`;
    g += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="chit"/>`;
    svg.innerHTML = g;

    const hit = svg.querySelector("#chit"), cross = svg.querySelector("#ccross");
    hit.addEventListener("mousemove", e => {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
      const k = Math.max(0, Math.min(C.length - 1, Math.floor((sx - m.l) / pw))), c = C[k];
      cross.setAttribute("x1", x(k)); cross.setAttribute("x2", x(k)); cross.setAttribute("visibility", "visible");
      tip.innerHTML = `<div class="muted">${dhm(c[0])}${c[6] === 1 ? " · en cours" : ""}</div>Ouv. <b>${px(c[1])}</b> · Haut <b>${px(c[2])}</b><br>` +
        `Bas <b>${px(c[3])}</b> · Clôt. <b>${px(c[4])}</b><br><span class="muted">Volume ${fmt(c[5] * c[4], 0)} $</span>`;
      tip.style.display = "block";
      const cx = x(k) / W * r.width;
      tip.style.left = (cx + 14 + tip.offsetWidth > r.width ? cx - tip.offsetWidth - 14 : cx + 14) + "px";
      tip.style.top = "10px";
    });
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
    try { localStorage.setItem("liquid-op", o.id); } catch (e) {}
  }

  list.addEventListener("click", e => { const b = e.target.closest(".op"); if (b) draw(+b.dataset.i); });
  window.showOp = id => {
    const i = D.ops.findIndex(o => o.id === id);
    if (i >= 0) { draw(i); list.scrollIntoView({behavior: "smooth", block: "nearest"}); }
  };
  let saved = null; try { saved = localStorage.getItem("liquid-op"); } catch (e) {}
  const start = D.ops.findIndex(o => o.id === saved);   // garde l'opération choisie après le rafraîchissement
  draw(start >= 0 ? start : 0);
})();

const table = (rows, cols, empty) => rows.length ? `<table><thead><tr>${cols.map(c => `<th class="${c[2] || ""}">${c[0]}</th>`).join("")}</tr></thead><tbody>` +
  rows.map(r => `<tr${r._op ? ` class="clk" onclick="showOp('${r._op}')"` : ""}>${cols.map(c => `<td class="${c[2] || ""}">${c[1](r)}</td>`).join("")}</tr>`).join("") + "</tbody></table>"
  : `<div class="empty">${empty}</div>`;
const book = r => `<span class="sw" style="display:inline-block;background:${color(r.book)}"></span> ${esc(label(r.book))}`;

const ops = new Set(D.ops.map(o => o.id));   // une ligne n'est cliquable que si son graphique existe
D.positions.forEach(r => r._op = `pos-${r.book}-${r.coin}`);
D.pending.forEach(r => r._op = `ord-${r.book}-${r.coin}`);
D.trades.forEach(r => r._op = `tr-${r.book}-${r.coin}-${new Date(r.opened.replace(" ", "T")).getTime()}`);
[D.positions, D.pending, D.trades].flat().forEach(r => { if (!ops.has(r._op)) delete r._op; });

document.getElementById("orders").innerHTML = table(D.orders, [
  ["Heure", r => esc(r.t)], ["Ordre", r => esc(r.what)], ["Pourquoi", r => esc(r.why), "why"],
], "Pas encore d'ordre discrétionnaire.");

// --- trades par stratégie : à venir, en cours, clôturés (gagnants / perdants)
(function strategies() {
  const tabs = document.getElementById("tabs"), out = document.getElementById("strat");
  const keys = ["all", ...D.books.map(b => b.key)];
  const of = (rows, k) => k === "all" ? rows : rows.filter(r => r.book === k);
  const total = rows => rows.reduce((s, r) => s + (+r.pnl || 0), 0);
  const sum = rows => rows.length ? `<span class="muted">${rows.length} · <span class="${cls(total(rows))}">${fmt(total(rows))} $</span>` +
    ` · ${fmt(rows.reduce((s, r) => s + (+r.r || 0), 0))} R</span>` : `<span class="muted">0</span>`;
  const lvl = v => v != null && v === v ? px(v) : "—";   // v === v écarte NaN

  tabs.innerHTML = keys.map(k => {
    const n = of(D.positions, k).length + of(D.pending, k).length + of(D.trades, k).length;
    const sw = k === "all" ? "" : `<span class="sw" style="background:${color(k)}"></span>`;
    return `<button class="tab" role="tab" data-k="${k}">${sw}${k === "all" ? "Toutes" : esc(label(k))} <span class="n">${n}</span></button>`;
  }).join("");

  function show(k) {
    tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
    const multi = k === "all", bk = multi ? [["Portefeuille", book]] : [];
    const pos = of(D.positions, k), pend = of(D.pending, k), tr = of(D.trades, k);
    const win = tr.filter(r => r.pnl > 0), loss = tr.filter(r => !(r.pnl > 0));
    const closed = [...bk, ["Clôture", r => loc(r.closed, true)], ["Marché", r => short(r.coin)], ["Sens", r => r.side],
      ["Entrée", r => px(r.entry), "num"], ["Sortie", r => px(r.exit), "num"],
      ["PnL", r => `<span class="${cls(r.pnl)}">${fmt(r.pnl)} $</span>`, "num"], ["R", r => fmt(r.r), "num"], ["Motif", r => esc(r.why)]];
    out.innerHTML =
      `<h3>À venir (ordres pour la prochaine bougie) <span class="muted">${pend.length}</span></h3>` +
      table(pend, [...bk, ["Marché", r => short(r.coin)],
        ["Ordre", r => r.action === "close" ? "Fermer" : (r.side > 0 ? "Achat (long)" : "Vente (short)")],
        ["Stop", r => lvl(r.stop), "num"], ["Objectif", r => lvl(r.target), "num"],
        ["Pourquoi", r => esc(r.why && r.why !== "signal" ? r.why : ""), "why"]], "Aucun ordre en attente.") +
      `<h3>En cours ${sum(pos)}</h3>` +
      table(pos, [...bk, ["Marché", r => short(r.coin)], ["Sens", r => r.side > 0 ? "Long" : "Short"],
        ["Entrée", r => px(r.entry), "num"], ["Cours", r => px(r.mark), "num"], ["Stop", r => px(r.stop), "num"],
        ["Objectif", r => r.target ? px(r.target) : "—", "num"], ["Notionnel", r => fmt(r.notional, 0) + " $", "num"],
        ["PnL", r => `<span class="${cls(r.pnl)}">${fmt(r.pnl)} $ (${fmt(r.r)} R)</span>`, "num"], ["Ouverte", r => loc(r.opened)]],
        "Aucune position ouverte.") +
      `<h3>Clôturés gagnants ${sum(win)}</h3>` + table(win, closed, "Aucun trade gagnant pour l'instant.") +
      `<h3>Clôturés perdants ${sum(loss)}</h3>` + table(loss, closed, "Aucun trade perdant pour l'instant.");
    try { localStorage.setItem("liquid-strat", k); } catch (e) {}
  }

  tabs.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.k); });
  let saved = null; try { saved = localStorage.getItem("liquid-strat"); } catch (e) {}
  show(keys.includes(saved) ? saved : "all");
})();
</script>
</body>
