  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --critical: #d03b3b; --up: #1baf7a; --down: #e34948; --entry: #2a78d6;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --good: #2fbf2f; --critical: #e66767; --up: #199e70; --down: #e66767; --entry: #3987e5;
  }
}
:root[data-theme="dark"] {
  --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --good: #2fbf2f; --critical: #e66767; --up: #199e70; --down: #e66767; --entry: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 10px; }
.muted { color: var(--text-muted); font-size: 12px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 16px 0; }
.tile, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .name { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tile .val { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--critical); }
.card { margin-top: 12px; overflow-x: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 6px; font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
#chart { position: relative; }
svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  display: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip .row { display: flex; align-items: center; gap: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; }
.empty { color: var(--text-muted); padding: 8px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.ops { display: grid; grid-template-columns: 300px 1fr; gap: 12px; }
@media (max-width: 860px) { .ops { grid-template-columns: 1fr; } }
.oplist { max-height: 470px; overflow-y: auto; border: 1px solid var(--grid); border-radius: 8px; }
.op { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--grid);
  padding: 8px 10px; cursor: pointer; color: var(--text-primary); font: inherit; font-size: 13px; }
.op:hover { background: var(--surface-0); }
.op[aria-selected="true"] { background: var(--surface-0); box-shadow: inset 3px 0 0 var(--text-secondary); }
.op .l2 { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.kind { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
.ophead { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.ophead b { font-weight: 600; }
.rule { font-size: 12px; color: var(--text-secondary); margin: 2px 0 8px; }
.keys { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.keys i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
#cwrap { position: relative; }
tr.clk { cursor: pointer; } tr.clk:hover td { background: var(--surface-0); }
.why { white-space: normal; min-width: 220px; color: var(--text-secondary); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: none; color: var(--text-secondary); font: inherit; font-size: 13px; }
.tab[aria-selected="true"] { background: var(--surface-0); color: var(--text-primary); border-color: var(--text-muted); }
.tab .n { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
h3 { font-size: 13px; margin: 14px 0 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
h3 .muted { font-weight: 400; }
.grp { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600;
  padding: 8px 10px 4px; background: var(--surface-1); border-bottom: 1px solid var(--grid); position: sticky; top: 0; }
</style>

(function chart() {
  const svg = document.getElementById("svg"), tip = document.getElementById("tip");
  const W = 1000, H = 320, m = {l: 56, r: 16, t: 12, b: 28};
  const times = D.times.map(t => new Date(t).getTime());
  if (times.length < 2) { svg.innerHTML = `<text x="20" y="40" fill="${css("--text-muted")}" font-size="14">Les courbes apparaîtront après quelques bougies.</text>`; return; }
  const all = D.books.flatMap(b => D.equity[b.key]).concat([D.capital]);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = Math.max((hi - lo) * 0.1, 5); lo -= pad; hi += pad;
  const x = t => m.l + (t - times[0]) / (times.at(-1) - times[0]) * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--grid")}"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${css("--text-muted")}">${fmt(v, 0)}</text>`;
  }
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(D.capital)}" y2="${y(D.capital)}" stroke="${css("--text-muted")}" stroke-dasharray="4 4"/>`;
  const nt = Math.min(6, times.length);
  for (let i = 0; i < nt; i++) {
    const t = times[0] + (times.at(-1) - times[0]) * i / (nt - 1);
    const d = new Date(t);
    g += `<text x="${x(t)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${css("--text-muted")}">${d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"})}</text>`;
  }
  for (const b of D.books) {
    const pts = D.equity[b.key].map((v, i) => `${x(times[i])},${y(v)}`).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="${color(b.key)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="${css("--text-muted")}" visibility="hidden"/><g id="dots"></g>`;
  g += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;
  const hit = svg.querySelector("#hit"), cross = svg.querySelector("#cross"), dots = svg.querySelector("#dots");
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
    let i = 0, best = Infinity;
    times.forEach((t, k) => { const d = Math.abs(x(t) - sx); if (d < best) { best = d; i = k; } });
    cross.setAttribute("x1", x(times[i])); cross.setAttribute("x2", x(times[i])); cross.setAttribute("visibility", "visible");
    dots.innerHTML = D.books.map(b => `<circle cx="${x(times[i])}" cy="${y(D.equity[b.key][i])}" r="4" fill="${color(b.key)}" stroke="${css("--surface-1")}" stroke-width="2"/>`).join("");
    const rows = [...D.books].sort((a, c) => D.equity[c.key][i] - D.equity[a.key][i]);
    tip.innerHTML = `<div class="muted">${new Date(times[i]).toLocaleString("fr-FR", {weekday: "short", hour: "2-digit", minute: "2-digit"})}</div>` +
      rows.map(b => `<div class="row"><span class="sw" style="background:${color(b.key)}"></span>${esc(b.label)}&nbsp;<b>${fmt(D.equity[b.key][i])} $</b></div>`).join("");
    tip.style.display = "block";
    const cx = (x(times[i]) / W) * r.width;
    tip.style.left = Math.min(cx + 14, r.width - tip.offsetWidth - 4) + "px";
    tip.style.top = "10px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.innerHTML = ""; });
})();

    hit.addEventListener("mousemove", e => {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
      const k = Math.max(0, Math.min(C.length - 1, Math.floor((sx - m.l) / pw))), c = C[k];
      cross.setAttribute("x1", x(k)); cross.setAttribute("x2", x(k)); cross.setAttribute("visibility", "visible");
      tip.innerHTML = `<div class="muted">${dhm(c[0])}${c[6] === 1 ? " · en cours" : ""}</div>Ouv. <b>${px(c[1])}</b> · Haut <b>${px(c[2])}</b><br>` +
        `Bas <b>${px(c[3])}</b> · Clôt. <b>${px(c[4])}</b><br><span class="muted">Volume ${fmt(c[5] * c[4], 0)} $</span>`;
      tip.style.display = "block";
      const cx = x(k) / W * r.width;
      tip.style.left = (cx + 14 + tip.offsetWidth > r.width ? cx - tip.offsetWidth - 14 : cx + 14) + "px";
      tip.style.top = "10px";
    });
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
    try { localStorage.setItem("liquid-op", o.id); } catch (e) {}
  }

  list.addEventListener("click", e => { const b = e.target.closest(".op"); if (b) draw(+b.dataset.i); });
  window.showOp = id => {
    const i = D.ops.findIndex(o => o.id === id);
    if (i >= 0) { draw(i); list.scrollIntoView({behavior: "smooth", block: "nearest"}); }
  };
  let saved = null; try { saved = localStorage.getItem("liquid-op"); } catch (e) {}
  const start = D.ops.findIndex(o => o.id === saved);   // garde l'opération choisie après le rafraîchissement
  draw(start >= 0 ? start : 0);
})();

const table = (rows, cols, empty) => rows.length ? `<table><thead><tr>${cols.map(c => `<th class="${c[2] || ""}">${c[0]}</th>`).join("")}</tr></thead><tbody>` +
  rows.map(r => `<tr${r._op ? ` class="clk" onclick="showOp('${r._op}')"` : ""}>${cols.map(c => `<td class="${c[2] || ""}">${c[1](r)}</td>`).join("")}</tr>`).join("") + "</tbody></table>"
  : `<div class="empty">${empty}</div>`;
const book = r => `<span class="sw" style="display:inline-block;background:${color(r.book)}"></span> ${esc(label(r.book))}`;

const ops = new Set(D.ops.map(o => o.id));   // une ligne n'est cliquable que si son graphique existe
D.positions.forEach(r => r._op = `pos-${r.book}-${r.coin}`);
D.pending.forEach(r => r._op = `ord-${r.book}-${r.coin}`);
D.trades.forEach(r => r._op = `tr-${r.book}-${r.coin}-${new Date(r.opened.replace(" ", "T")).getTime()}`);
[D.positions, D.pending, D.trades].flat().forEach(r => { if (!ops.has(r._op)) delete r._op; });

document.getElementById("orders").innerHTML = table(D.orders, [
  ["Heure", r => esc(r.t)], ["Ordre", r => esc(r.what)], ["Pourquoi", r => esc(r.why), "why"],
], "Pas encore d'ordre discrétionnaire.");

// --- trades par stratégie : à venir, en cours, clôturés (gagnants / perdants)
(function strategies() {
  const tabs = document.getElementById("tabs"), out = document.getElementById("strat");
  const keys = ["all", ...D.books.map(b => b.key)];
  const of = (rows, k) => k === "all" ? rows : rows.filter(r => r.book === k);
  const total = rows => rows.reduce((s, r) => s + (+r.pnl || 0), 0);
  const sum = rows => rows.length ? `<span class="muted">${rows.length} · <span class="${cls(total(rows))}">${fmt(total(rows))} $</span>` +
    ` · ${fmt(rows.reduce((s, r) => s + (+r.r || 0), 0))} R</span>` : `<span class="muted">0</span>`;
  const lvl = v => v != null && v === v ? px(v) : "—";   // v === v écarte NaN

  tabs.innerHTML = keys.map(k => {
    const n = of(D.positions, k).length + of(D.pending, k).length + of(D.trades, k).length;
    const sw = k === "all" ? "" : `<span class="sw" style="background:${color(k)}"></span>`;
    return `<button class="tab" role="tab" data-k="${k}">${sw}${k === "all" ? "Toutes" : esc(label(k))} <span class="n">${n}</span></button>`;
  }).join("");

  function show(k) {
    tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
    const multi = k === "all", bk = multi ? [["Portefeuille", book]] : [];
    const pos = of(D.positions, k), pend = of(D.pending, k), tr = of(D.trades, k);
    const win = tr.filter(r => r.pnl > 0), loss = tr.filter(r => !(r.pnl > 0));
    const closed = [...bk, ["Clôture", r => loc(r.closed, true)], ["Marché", r => short(r.coin)], ["Sens", r => r.side],
      ["Entrée", r => px(r.entry), "num"], ["Sortie", r => px(r.exit), "num"],
      ["PnL", r => `<span class="${cls(r.pnl)}">${fmt(r.pnl)} $</span>`, "num"], ["R", r => fmt(r.r), "num"], ["Motif", r => esc(r.why)]];
    out.innerHTML =
      `<h3>À venir (ordres pour la prochaine bougie) <span class="muted">${pend.length}</span></h3>` +
      table(pend, [...bk, ["Marché", r => short(r.coin)],
        ["Ordre", r => r.action === "close" ? "Fermer" : (r.side > 0 ? "Achat (long)" : "Vente (short)")],
        ["Stop", r => lvl(r.stop), "num"], ["Objectif", r => lvl(r.target), "num"],
        ["Pourquoi", r => esc(r.why && r.why !== "signal" ? r.why : ""), "why"]], "Aucun ordre en attente.") +
      `<h3>En cours ${sum(pos)}</h3>` +
      table(pos, [...bk, ["Marché", r => short(r.coin)], ["Sens", r => r.side > 0 ? "Long" : "Short"],
        ["Entrée", r => px(r.entry), "num"], ["Cours", r => px(r.mark), "num"], ["Stop", r => px(r.stop), "num"],
        ["Objectif", r => r.target ? px(r.target) : "—", "num"], ["Notionnel", r => fmt(r.notional, 0) + " $", "num"],
        ["PnL", r => `<span class="${cls(r.pnl)}">${fmt(r.pnl)} $ (${fmt(r.r)} R)</span>`, "num"], ["Ouverte", r => loc(r.opened)]],
        "Aucune position ouverte.") +
      `<h3>Clôturés gagnants ${sum(win)}</h3>` + table(win, closed, "Aucun trade gagnant pour l'instant.") +
      `<h3>Clôturés perdants ${sum(loss)}</h3>` + table(loss, closed, "Aucun trade perdant pour l'instant.");
    try { localStorage.setItem("liquid-strat", k); } catch (e) {}
  }

  tabs.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.k); });
  let saved = null; try { saved = localStorage.getItem("liquid-strat"); } catch (e) {}
  show(keys.includes(saved) ? saved : "all");
})();
</script>
</body>
</html>
